  .karte {
    background: #1b2330; border-radius: 12px; margin: 8px;

</div></div>
<style>

</style>
<div id="wetter-detail"></div>
<div class="fuss">Daten: MVV-Fahrplanauskunft mit Echtzeit, ohne Gewähr. Aktualisierung alle 60 Sekunden.</div>

<script>
// ============================================================
// EINSTELLUNGEN  – hier anpassen
// ============================================================
var CONFIG = {
  // Alle Daten kommen direkt von der MVV-Fahrplanauskunft (mit Echtzeit), ohne Zwischenserver.
  aktualisierenSek: 60,
  maxZeilen: 3,
  karten: [
    // Busse: Haltestelle Unterhaching, Goerdelerstraße.
    // Steig 2 = Richtung Bahnhof Unterhaching (217 nach "Unterhaching (S)", 220 über Bahnhof nach Winning/Brunnthal).
    { titel: "Bus 220 → Giesing", unter: "ab Goerdelerstraße, Steig 1", quelle: "mvv",
      station: "de:09184:2374", linien: ["220"], steig: "1" },
    { titel: "Bus 217 → Bahnhof", unter: "ab Goerdelerstraße · morgens auch 220V", quelle: "mvv",
      station: "de:09184:2374", linien: ["217", "220V"], ziel: /Unterhaching \(S\)/ },
    // S3: S-Bahnhof Unterhaching, Gleis 2 = Holzkirchen, Gleis 1 = Mammendorf.
    { titel: "S3 → Holzkirchen", unter: "ab Unterhaching, Gleis 2", quelle: "mvv",
      station: "de:09184:2310", linien: ["S3"], steig: "2" },
    { titel: "S3 → Mammendorf", unter: "ab Unterhaching, Gleis 1", quelle: "mvv",
      station: "de:09184:2310", linien: ["S3"], steig: "1" }
  ]
};
// ============================================================

var DEMO = /[?&]demo=1/.test(location.search);
var EFA = "https://efa.mvv-muenchen.de/ng/XML_DM_REQUEST?outputFormat=rapidJSON&type_dm=any&mode=direct&useRealtime=1&limit=40&name_dm=";
var jsonpNr = 0;

// JSONP: lädt die Daten per <script>-Tag. So erlaubt die MVV den Abruf von jeder Webseite aus.
function holeJsonp(url, ok, fehler) {
  var name = "mvvAntwort" + (++jsonpNr), tag = document.createElement("script"), erledigt = false;
  function aufraeumen() { erledigt = true; try { delete window[name]; } catch (e) { window[name] = undefined; } if (tag.parentNode) tag.parentNode.removeChild(tag); }
  window[name] = function (d) { if (erledigt) return; aufraeumen(); ok(d); };
  tag.onerror = function () { if (erledigt) return; aufraeumen(); fehler("Netzwerkfehler"); };
  setTimeout(function () { if (erledigt) return; aufraeumen(); fehler("Zeitüberschreitung"); }, 15000);
  tag.src = url + "&jsonp=" + name + "&_=" + Date.now();
  document.getElementsByTagName("head")[0].appendChild(tag);
}

function $(id) { return document.getElementById(id); }
function zwei(n) { return (n < 10 ? "0" : "") + n; }
function hhmm(d) { return zwei(d.getHours()) + ":" + zwei(d.getMinutes()); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
// ISO-Zeit ("2026-11-23T17:30:00Z") -> Millisekunden, auch auf altem Safari
function isoMs(s) {
  if (!s) return null;
  var m = /^(\d+)-(\d+)-(\d+)T(\d+):(\d+):(\d+)/.exec(s);
  return m ? Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]) : null;
}

// Einheitliches Format: {linie, ziel, plan, echt, ausfall, steig, sbahn}
function vonMvv(daten) {
  var ev = daten.stopEvents || [], raus = [];
  for (var i = 0; i < ev.length; i++) {
    var e = ev[i], t = e.transportation || {}, p = (e.location && e.location.properties) || {};
    raus.push({ linie: String(t.number || t.disassembledName || ""), ziel: (t.destination && t.destination.name) || "",
      plan: isoMs(e.departureTimePlanned), echt: isoMs(e.departureTimeEstimated), ausfall: !!e.isCancelled,
      steig: p.platform ? String(p.platform) : "", sbahn: !!(t.product && t.product.class === 1) });
  }
  return raus;
}

var cache = {};
function holeAbfahrten(k, ok, fehler) {
  if (DEMO) { ok(demoDaten(k)); return; }
  var schluessel = k.quelle + k.station;
  if (cache[schluessel] && cache[schluessel].zeit > Date.now() - 20000) { ok(cache[schluessel].daten); return; }
  function merken(d) { cache[schluessel] = { zeit: Date.now(), daten: d }; ok(d); }
  holeJsonp(EFA + encodeURIComponent(k.station), function (d) { merken(vonMvv(d)); }, fehler);
}

function filtere(k, abfahrten) {
  var jetzt = Date.now(), raus = [];
  for (var i = 0; i < abfahrten.length; i++) {
    var a = abfahrten[i];
    if (k.linien.indexOf(a.linie) < 0) continue;
    if (k.steig && a.steig && a.steig !== k.steig) continue;
    if (k.ziel && !k.ziel.test(a.ziel)) continue;
    if ((a.echt || a.plan) < jetzt - 30000) continue;
    raus.push(a);
  }
  raus.sort(function (x, y) { return (x.echt || x.plan) - (y.echt || y.plan); });
  return raus.slice(0, CONFIG.maxZeilen);
}

function zeileHtml(a) {
  var t = new Date(a.echt || a.plan);
  var min = Math.max(0, Math.round((t.getTime() - Date.now()) / 60000));
  var verspaetung = a.echt ? Math.round((a.echt - a.plan) / 60000) : 0;
  var minText = a.ausfall ? "fällt aus" : (min === 0 ? "jetzt" : min + " min");
  var zusatz = hhmm(new Date(a.plan)) + (verspaetung > 0 ? ' <span class="spaet">+' + verspaetung + "</span>" : "") + (a.echt ? "" : " (Plan)");
  return '<div class="zeile' + (a.ausfall ? " ausfall" : "") + '">' +
    '<span class="' + (a.sbahn ? "linie sbahn s3" : "linie bus") + '">' + esc(a.linie) + "</span>" +
    '<span class="zeit"><span class="min' + (verspaetung > 2 ? " spaet" : "") + '">' + minText + '</span><span class="uhrzeit">' + zusatz + "</span></span>" +
    '<div class="ziel">' + esc(a.ziel.replace(/^München, /, '')) + "</div></div>";
}

function zeichneKarte(i, inhalt) {
  var k = CONFIG.karten[i];
  $("karte" + i).innerHTML = "<h2>" + esc(k.titel) + '</h2><div class="unter">' + esc(k.unter) + "</div>" + inhalt;
}

function aktualisiere() {
  var offen = CONFIG.karten.length, fehlerTexte = [];
  function fertig() {
    offen--;
    if (offen > 0) return;
    var s = $("stand");
    if (fehlerTexte.length) { s.className = "stand fehler"; s.innerHTML = "Problem: " + esc(fehlerTexte[0]) + " · " + hhmm(new Date()); }
    else { s.className = "stand"; s.innerHTML = (DEMO ? "DEMO-Daten · " : "") + "Stand " + hhmm(new Date()); }
  }
  for (var i = 0; i < CONFIG.karten.length; i++) {
    (function (i) {
      var k = CONFIG.karten[i];
      holeAbfahrten(k, function (liste) {
        var zeilen = filtere(k, liste), html = "";
        for (var j = 0; j < zeilen.length; j++) html += zeileHtml(zeilen[j]);
        zeichneKarte(i, html || '<div class="hinweis">Keine Abfahrten gefunden</div>');
        fertig();
      }, function (err) {
        fehlerTexte.push(err);
        zeichneKarte(i, '<div class="hinweis">Keine Daten: ' + esc(err) + "</div>");
        fertig();
      });
    })(i);
  }
}

// Beispieldaten zum Testen des Layouts: abfahrten.html?demo=1
function demoDaten(k) {
  var jetzt = Date.now(), raus = [], bus = k.linien[0].charAt(0) !== "S";
  var ziele = bus ? (k.linien[0] === "217" ? ["Unterhaching (S)"] : ["Brunnthal, Zusestraße", "Winning, Riegerweg/Altersheim"])
                  : (k.steig === "2" ? ["Holzkirchen", "Deisenhofen"] : ["Mammendorf", "Ostbahnhof"]);
  for (var n = 0; n < 6; n++) {
    var plan = jetzt + (2 + n * (bus ? 10 : 20)) * 60000, delay = n === 1 ? 3 : 0;
    raus.push({ linie: k.linien[0], ziel: ziele[n % ziele.length], plan: plan, echt: plan + delay * 60000,
      ausfall: n === 3 && !bus, steig: k.steig, sbahn: !bus });
  }
  return raus;
}

function uhr() { $("uhr").innerHTML = hhmm(new Date()); }

(function start() {
  var html = "";
  for (var i = 0; i < CONFIG.karten.length; i++) html += '<div class="karte" id="karte' + i + '"></div>';
  $("raster").innerHTML = html;
  uhr(); setInterval(uhr, 5000);
  aktualisiere(); setInterval(aktualisiere, CONFIG.aktualisierenSek * 1000);
  // Alle 6 Stunden komplett neu laden (hält die Seite frisch)
  setTimeout(function () { location.reload(); }, 6 * 3600 * 1000);
})();
</script>

<script>
(function () {
  var WT = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  var MO = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  function datum() { var d = new Date(); document.getElementById("kopf-datum").innerHTML = WT[d.getDay()] + ", " + d.getDate() + ". " + MO[d.getMonth()]; }
  datum(); setInterval(datum, 60000);
})();
</script>
<script>
/* Skaliert das Dashboard so, dass es genau auf den Bildschirm passt (nie scrollen).
   Arbeitet mit transform: scale auf einer Hülle. Vergrößert nur so weit, dass die Seite mindestens MIN_BREITE px breit bleibt. Die Uhr-Ansicht (#ruhe) liegt außerhalb und bleibt unverändert. ES5. */
(function () {
  var MIN = 0.55, MAX = 1.3, MIN_BREITE = 1000, huelle = null, letzt = 0;
  function huelleBauen() {
    huelle = document.createElement("div");
    huelle.id = "alles";

<script>

<script>
/* Vollbild: beim Antippen wechselt Safari (iPad ab iPadOS 12) in den Vollbildmodus, ohne Adressleiste.
   Geht nur durch eine Berührung, nicht automatisch. Fällt der Vollbildmodus weg (z. B. neuer Tab vom Kurzbefehl),
   holt ihn das nächste Antippen zurück. ?ohnevollbild=1 schaltet das ab. ES5.
   Nur beim "click" anfordern (wie auf der Testseite), nicht zusätzlich bei touchend: eine zweite Anforderung
   während des Übergangs bricht den Vollbildmodus auf dem iPad wieder ab. */
(function () {
  if (/[?&]ohnevollbild=1/.test(location.search)) return;
  var el = document.documentElement;
  var anfordern = el.webkitRequestFullscreen || el.requestFullscreen || el.webkitRequestFullScreen;
  if (!anfordern) return;
  var gesperrtBis = 0;
  // Hintergrund im Vollbild über die ganze Höhe (sonst bleibt unten ein weißer Streifen)
  try { el.style.backgroundColor = window.getComputedStyle(document.body).backgroundColor || "#10151c"; } catch (e) {}
  function istVoll() { return !!(document.webkitFullscreenElement || document.fullscreenElement || document.webkitCurrentFullScreenElement); }
  document.addEventListener("click", function () {
    if (istVoll() || Date.now() < gesperrtBis) return;
    gesperrtBis = Date.now() + 2000;
    try { var p = anfordern.call(el); if (p && p["catch"]) p["catch"](function () {}); } catch (e) {}
  }, false);
  function neu() {
    gesperrtBis = 0;
    if (window.Einpassen) { window.Einpassen(); setTimeout(window.Einpassen, 400); setTimeout(window.Einpassen, 1200); }
  }
  // Öffnet der Kurzbefehl die Seite neu, während Safari noch im Vollbild ist, greift :-webkit-full-screen nicht
  // (die neue Seite ist nicht das Vollbild-Element), Safaris X liegt dann über dem Datum. Deshalb zusätzlich:
  // füllt die Seite den ganzen Bildschirm (keine Safari-Leiste), Klasse vb-rand setzen.
  function rand() {
    var w = screen.width, h = screen.height, quer = window.innerWidth > window.innerHeight;
    var bildschirmHoehe = quer ? Math.min(w, h) : Math.max(w, h);
    var voll = istVoll() || window.innerHeight >= bildschirmHoehe - 2;
    var c = el.className.replace(/\s*\bvb-rand\b/g, "");
    el.className = voll ? (c + " vb-rand") : c;
  }
  rand();
  window.addEventListener("resize", function () { rand(); setTimeout(rand, 500); }, false);
  setInterval(rand, 5000);
  document.addEventListener("fullscreenchange", rand, false);
  document.addEventListener("webkitfullscreenchange", rand, false);
  document.addEventListener("fullscreenchange", neu, false);
  document.addEventListener("webkitfullscreenchange", neu, false);
})();

</script>

<script>
/* Uhr-Ansicht: nach RUHE_SEK Sekunden ohne Berührung gedimmte Ansicht wie der Kopf einer Wetter-App:
   kleine Uhr mit Datum, Ort, große Temperatur, Wetterbeschreibung, Höchst-/Tiefstwert vor wetterabhängigem Himmel. Antippen zeigt wieder das Dashboard.
   Gegen Einbrennen wandert der Block jede Minute ein wenig. Ecke oben links bleibt frei (Safaris X im Vollbild). ES5.
   Testen: ?nacht=1 zeigt die Uhr-Ansicht sofort, ?ohneruhe=1 schaltet sie ganz ab. */
(function () {
  var RUHE_SEK = 300;
  var WT = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  var MO = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  var KURZ = ["Giesing", "Bahnhof", "Holzkirchen", "Mammendorf"];
  var ruhe = document.getElementById("ruhe"), block = document.getElementById("aod");
  var aus = /[?&]ohneruhe=1/.test(location.search);
  var letzte = /[?&]nacht=1/.test(location.search) ? 0 : Date.now(), letzteMinute = -1;
  function zwei(n) { return (n < 10 ? "0" : "") + n; }
  function txt(el) { return el ? (el.textContent || "").replace(/\s+/g, " ").replace(/^\s+|\s+$/g, "") : ""; }
  function himmelArt(c) {
    if (c <= 1) return "klar";
    if (c <= 3) return "wolken";
    if (c === 45 || c === 48) return "nebel";
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) return "schnee";
    if (c >= 95) return "gewitter";
    return "regen";
  }
  var letzterHimmel = "";
  function wetter() { // Himmel nur neu setzen, wenn sich das Wetter ändert (sonst starten die Animationen neu)
    var wj = window.WetterJetzt;
    if (!wj) return;
    var cls = "h-" + himmelArt(wj.code) + "-" + (wj.tag ? "tag" : "nacht") + (wj.code === 1 ? " h-teils" : "");
    if (cls !== letzterHimmel) { ruhe.className = cls; letzterHimmel = cls; }
    document.getElementById("aod-wtemp").innerHTML = '<span class="aod-zahl">' + Math.round(wj.temp) + '<span class="aod-grad">°</span></span>';
    document.getElementById("aod-wtext").innerHTML = wj.text || "";
    document.getElementById("aod-whl").innerHTML = wj.hoch != null ? "H: " + Math.round(wj.hoch) + "° &nbsp;T: " + Math.round(wj.tief) + "°" : "";
  }
  function entfall() { // nur Entfall aus dem Vertretungsplan, je Kind eine Zeile, z. B. „Anna: Heute 3., 4. Std“

      name = name.replace(/^\s+|\s+$/g, "").split(" ")[0];

      for (var j = 0; j < tage.length; j++) {
        var std = tage[j].querySelectorAll(".vp-entfall .vp-std"), liste = [];
        for (var n = 0; n < std.length; n++) liste.push(txt(std[n]));
        if (!liste.length) continue;
        var tn = txt(tage[j].querySelector(".vp-tagname")).split(" · ")[0].split(" ")[0];
        teile.push(tn + " " + liste.join(", ") + " Std");
      }

  }
  function abfahrten() {
    var html = "";
    for (var i = 0; i < 4; i++) {

      if (!lin || !min || !txt(min)) continue;

        '<span class="aod-ziel">' + KURZ[i] + '</span><span class="aod-min">' + txt(min) + "</span></span>";
    }

  }

    var ef = entfall(), efEl = document.getElementById("aod-entfall"); if (efEl.innerHTML !== ef) efEl.innerHTML = ef;
    // Abfahrten in der Uhr-Ansicht auf Minas Wunsch weggelassen (abfahrten() bleibt für später)

  pruefe(); setInterval(pruefe, 5000);

<script>
/* Uhr-Ansicht: „Schnee/Regen in x Min“ aus dem DWD-Regenradar (Vorhersage bis ca. 2 Std, 5-Minuten-Schritte)
   und amtliche DWD-Warnungen für Unterhaching. Beides über Bright Sky (kostenlos, ohne Schlüssel). ES5.
   Testen: ?hinweistest=1 zeigt Beispielhinweise. */
(function () {
  var URL_RADAR = "https://api.brightsky.dev/radar?lat=48.066&lon=11.616&distance=1000&format=plain";
  var URL_WARN = "https://api.brightsky.dev/alerts?lat=48.066&lon=11.616";
  var SCHWELLE = 2; // precipitation_5 in 0,01 mm je 5 Min; 2 ≈ 0,24 mm/h, darunter nur Radar-Rauschen
  var radar = null, warnungen = [];
  var FARBE = { minor: "#ffd84d", moderate: "#ffa53a", severe: "#ff5b4a", extreme: "#d070ff" };
  function holen(url, fertig) {
    var x = new XMLHttpRequest();
    x.open("GET", url, true);
    x.onreadystatechange = function () {
      if (x.readyState === 4 && x.status === 200) { try { fertig(JSON.parse(x.responseText)); } catch (e) {} }
    };
    x.send();
  }
  function zwei(n) { return (n < 10 ? "0" : "") + n; }
  function uhr(d) { return d.getHours() + ":" + zwei(d.getMinutes()); }
  function wort(s) { return s.toLowerCase().replace(/(^|[\s\-\/])(\S)/g, function (m, a, b) { return a + b.toUpperCase(); }); }
  function art() { // gleiche Art wie die Wetterzeile darüber, sonst nach Temperatur
    var wj = window.WetterJetzt || {}, t = wj.temp != null ? wj.temp : 5;
    if (wj.nass && wj.text) return wj.schnee ? "Schnee" : (/Gewitter/.test(wj.text) ? "Regen" : wj.text);
    return t <= 0.5 ? "Schnee" : (t <= 2 ? "Schneeregen" : "Regen");
  }
  function niederschlag() {
    if (!radar || !radar.length) return "";
    var jetzt = Date.now(), reihe = [];
    for (var i = 0; i < radar.length; i++) {
      var t = Date.parse(radar[i].timestamp);
      if (t < jetzt - 5 * 60000) continue;
      var g = radar[i].precipitation_5, m = 0;
      for (var a = 0; a < g.length; a++) for (var b = 0; b < g[a].length; b++) m = Math.max(m, g[a][b]); // 3×3 Kacheln um Unterhaching
      reihe.push({ t: t, nass: m >= SCHWELLE });

    if (reihe.length < 2) return "";
    var was = art(), ende = reihe[reihe.length - 1].t;
    function min(t) { return Math.max(5, Math.round((t - jetzt) / 300000) * 5); }
    var gemessenNass = !!(window.WetterJetzt && window.WetterJetzt.nass); // Messstation meldet schon Niederschlag
    if (reihe[0].nass || gemessenNass) {
      if (!reihe[0].nass) return ""; // Radar sieht (noch) nichts: keine widersprüchliche Ansage
      for (var j = 1; j < reihe.length - 1; j++) if (!reihe[j].nass && !reihe[j + 1].nass) return was + " hört in ca. " + min(reihe[j].t) + " Min auf";
      return was + " noch mindestens bis " + uhr(new Date(ende));

    for (var k = 1; k < reihe.length; k++) if (reihe[k].nass) return was + " in ca. " + min(reihe[k].t) + " Min";

    var jetzt = Date.now(), html = "", schon = {};

      var w = warnungen[i], von = Date.parse(w.onset), bis = Date.parse(w.expires);

      var name = wort(w.event_de || ""); if (!name || schon[name]) continue; schon[name] = 1;

      if (von && von > jetzt) zeit = "ab " + (new Date(von).toDateString() === heute ? "" : "morgen ") + uhr(new Date(von)) + " Uhr";

      else zeit = "";
      html += '<span class="aod-warn" style="color:' + (FARBE[w.severity] || FARBE.minor) + '"><span class="aod-warn-zeichen">&#9888;&#xFE0E;</span> DWD-Warnung: ' + name + (zeit ? ' <span class="aod-warn-zeit">' + zeit + "</span>" : "") + "</span>";
    }

  }

      { event_de: "GLÄTTE", severity: "moderate", onset: new Date(t0 + 2 * 3600000).toISOString(), expires: new Date(t0 + 9 * 3600000).toISOString() }];
    setTimeout(zeigen, 2500); setInterval(zeigen, 30000);

  }
  laden();
  setInterval(laden, 5 * 60 * 1000);
  setInterval(zeigen, 60 * 1000); // Minuten weiterzählen
})();

</script>
<script>
/*
 * Vertretungsplan-Baustein fürs iPad-Dashboard (ohne Server).
 *
 * Ein iOS-Kurzbefehl holt den Vertretungsplan aus dem Eltern-Portal und
 * öffnet das Dashboard mit den Daten im Link-Hash:
 *     https://<dashboard>/#vp=<Base64>
 * Base64-Inhalt (UTF-8): pro Kind  "Name\n<HTML der Vertretungsplan-Seite>",
 * Kinder getrennt durch "@@KIND@@". Optional pro Kind hinter "@@SA@@" die
 * Tabellenzeilen der Seite /service/termine/liste/schulaufgaben, hinter "@@SP@@"
 * die Tabelle der Seite /service/stundenplan (nur in der Detailansicht sichtbar).
 * Der Hash wird nie an einen Server geschickt. Die Seite merkt sich die
 * Daten im localStorage des iPads und entfernt sie danach aus der Adresse.
 *
 * Einbinden:  <div id="vertretung"></div>
 *             Skript vertretung-ipad.js laden, dann Vertretung.start("vertretung")
 * ES5, damit es auch in älteren Safaris läuft.
 */
(function () {
  var SPEICHER = "vertretungsplan_v1";
  var TAGE_ANZEIGEN = 2;
  var ZEILEN = 6;
  var SA_ANZAHL = 3;
  // Im Stundenplan bei geteilten Fächern („Sm/Sw“) diese Teile pro Kind (Vorname) weglassen.
  // "alle" gilt jeden Tag, "Mo".."Fr" nur an dem Tag. Endungen wie "_2" oder "_ILR" fallen immer weg.
  var SP_WEGLASSEN = {
    Anna: { alle: ["Sm", "K", "Eth"] },
    Felix: { alle: ["Sw", "K", "Eth"], Di: ["IT"], Fr: ["EG"] }
  }; // so viele kommende Schulaufgaben pro Kind // feste Zeilenzahl pro Kind, damit sich das Layout nicht verschiebt
  var WT = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];

  function iso(d) {
    var m = d.getMonth() + 1, t = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (t < 10 ? "0" : "") + t;
  }
  function txt(el) {
    return (el ? el.textContent : "").replace(/ /g, " ").replace(/\s+/g, " ").replace(/^\s+|\s+$/g, "");
  }
  function esc(t) {
    return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function art(info, betrifft, vertretung, fach) {
    var i = info.toLowerCase();
    if (/entf|fällt aus|(^|\W)frei(\W|$)|selbststudium|ausfall/.test(i)) return "entfall";
    if (/entf|fällt aus|ausfall/i.test(vertretung)) return "entfall";
    if (!vertretung && !fach) return "entfall";
    if (vertretung && vertretung !== betrifft) return "vertretung";
    if (i.indexOf("raum") >= 0) return "raum";
    return "sonstiges";
  }

  /* Zerlegt die Seite /service/vertretungsplan (gleiche Logik wie das Python-Skript) */
  function parsen(html) {
    html = String(html).split(/@@S[AP]@@/)[0];
    var doc = new DOMParser().parseFromString(html, "text/html");
    var inhalt = doc.getElementById("asam_content") || doc.body;
    var h2 = inhalt.querySelector("h2");
    var km = txt(h2).match(/Klasse\s+(\S+)/);
    var plan = { klasse: km ? km[1] : "", stand: "", tage: [] };
    var mitte = inhalt.querySelector(".main_center") || inhalt;
    var tag = null, kinder = mitte.children;
    for (var n = 0; n < kinder.length; n++) {
      var el = kinder[n], t = txt(el);
      if (el.tagName === "DIV" && /(^|\s)list(\s|$)/.test(el.className)) {
        if (/^Stand/.test(t)) { plan.stand = t.replace(/^Stand:?\s*/, ""); continue; }
        var d = t.match(/(\d{2})\.(\d{2})\.(\d{4})/);
        if (d) {
          var datum = d[3] + "-" + d[2] + "-" + d[1];
          tag = { datum: datum, wochentag: WT[new Date(+d[3], +d[2] - 1, +d[1]).getDay()], eintraege: [], hinweise: [] };

        var kopf = el.querySelector("tr.vp_plan_head");
        if (kopf) {
          var kz = kopf.querySelectorAll("td");
          for (var a = 0; a < kz.length; a++) { spalten[txt(kz[a]).replace(/\.$/, "").toLowerCase()] = a; anzahl++; }
        }
        for (var z = 0; z < zeilen.length; z++) {

  /* Schulaufgaben: Zeilen der Seite /service/termine/liste/schulaufgaben
     (Spalte 1 Datum, Spalte 3 Titel). Liefert [{datum, titel}], nach Datum sortiert. */
  function saParsen(html) {
    var doc = new DOMParser().parseFromString("<table>" + html + "</table>", "text/html");
    var zeilen = doc.querySelectorAll("tr"), liste = [], gesehen = {};
    for (var z = 0; z < zeilen.length; z++) {

      if (c.length < 2) continue;
      var d = null, dz = -1;
      for (var a = 0; a < c.length && !d; a++) { d = txt(c[a]).match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/); dz = a; }
      if (!d) continue;
      var titel = c.length > 2 && dz !== 2 ? txt(c[2]) : "";
      if (!titel) {
        var teile = [];
        for (var b = 0; b < c.length; b++) if (b !== dz && txt(c[b])) teile.push(txt(c[b]));
        titel = teile.join(" · ");

      if (!titel) continue;
      var datum = d[3] + "-" + (d[2].length < 2 ? "0" : "") + d[2] + "-" + (d[1].length < 2 ? "0" : "") + d[1];
      if (gesehen[datum + titel]) continue;
      gesehen[datum + titel] = 1;
      liste.push({ datum: datum, titel: titel });
    }
    liste.sort(function (x, y) { return x.datum < y.datum ? -1 : x.datum > y.datum ? 1 : 0; });
    return liste;
  }

  /* Stundenplan: Tabelle der Seite /service/stundenplan. Kopfzeile mit Wochentagen,
     danach pro Stunde: erste Zelle "Nr<br>Uhrzeit", dann je Tag "Fach<br>Raum".
     Liefert {tage:["Mo",…], stunden:[{nr, zeit, zellen:[[zeile,…],…]}]} oder null. */
  function zeilenVon(el) {
    var k = el.cloneNode(true), brs = k.querySelectorAll("br");
    for (var i = 0; i < brs.length; i++) brs[i].parentNode.replaceChild(document.createTextNode("\n"), brs[i]);
    var roh = (k.textContent || "").replace(/\u00a0/g, " ").split("\n"), aus = [];
    for (var j = 0; j < roh.length; j++) { var z = roh[j].replace(/\s+/g, " ").replace(/^\s+|\s+$/g, ""); if (z) aus.push(z); }
    return aus;
  }
  function spParsen(html) {
    var doc = new DOMParser().parseFromString(String(html), "text/html");
    // Die Seite hat mehrere Tabellen (z. B. auch Fach/Lehrkraft). Nur die mit Wochentagen ist der Stundenplan.
    var tab = doc.querySelectorAll("table"), beste = null;
    for (var i = 0; i < tab.length && !beste; i++) {
      var tz = tab[i].querySelectorAll("tr");
      for (var r = 0; r < tz.length && r < 3 && !beste; r++) {
        var zc = tz[r].querySelectorAll("td, th"), wt = 0;
        for (var q = 0; q < zc.length; q++) if (/^(mo|di|mi|do|fr)/i.test(txt(zc[q]))) wt++;
        if (wt >= 3) beste = tab[i];
      }
    }
    if (!beste) return null;
    var zeilen = beste.querySelectorAll("tr"), tage = null, stunden = [];
    for (var z = 0; z < zeilen.length; z++) {
      var c = zeilen[z].querySelectorAll("td, th");
      if (c.length < 2) continue;
      if (!tage) {
        var kopf = [];
        for (var a = 1; a < c.length; a++) kopf.push(txt(c[a]));
        if (/^(mo|di|mi|do|fr)/i.test(kopf.join(" ").replace(/^\s+/, ""))) {
          tage = [];
          for (var b2 = 0; b2 < kopf.length; b2++) tage.push(kopf[b2].slice(0, 2));
          continue;
        }
      }
      var erste = zeilenVon(c[0]), zellen = [], belegt = false;
      for (var d = 1; d < c.length; d++) { var zz = zeilenVon(c[d]); if (zz.length) belegt = true; zellen.push(zz); }
      if (!erste.length && !belegt) continue;
      stunden.push({ nr: (erste[0] || "").replace(/\.$/, ""), zeit: erste.slice(1).join(" ").replace(/\./g, ":"), zellen: zellen });
    }
    if (!stunden.length) return null;
    // leere Stunden am Ende weglassen
    while (stunden.length) {
      var l = stunden[stunden.length - 1], leer = true;
      for (var e = 0; e < l.zellen.length; e++) if (l.zellen[e].length) leer = false;
      if (!leer) break;
      stunden.pop();
    }
    return { tage: tage || ["Mo", "Di", "Mi", "Do", "Fr"], stunden: stunden };
  }
  function spBeschreibung(html) { // zur Fehlersuche: welche Tabellen kamen an?
    var doc = new DOMParser().parseFromString(String(html), "text/html"), tab = doc.querySelectorAll("table"), teile = [];
    for (var i = 0; i < tab.length && i < 4; i++) { var z = tab[i].querySelector("tr"); teile.push(tab[i].querySelectorAll("tr").length + " Zeilen: " + txt(z).slice(0, 60)); }
    return String(html).length + " Zeichen, " + tab.length + " Tabellen" + (teile.length ? " · " + teile.join(" · ") : "");
  }
  function spZeit(z) { // "07:50 - 08:35" → "07:50–08:35"; nur Beginn → Ende = +45 Min.
    var m = String(z).match(/(\d{1,2}):(\d{2})(?:\D+(\d{1,2}):(\d{2}))?/);
    if (!m) return z;
    var p2 = function (n) { return (n < 10 ? "0" : "") + n; };
    var ende = m[3] ? p2(+m[3]) + ":" + m[4] : (function () { var t = +m[1] * 60 + +m[2] + 45; return p2(Math.floor(t / 60)) + ":" + p2(t % 60); })();
    return p2(+m[1]) + ":" + m[2] + "–" + ende;
  }
  function spFach(f, name, tag) { // "IT/IT_2" → "IT", "M_ILR" → "M"; dazu die Teile aus SP_WEGLASSEN weg
    if (f.indexOf("/") < 0) return f.replace(/^([^_]+)_.*$/, "$1");
    var k = SP_WEGLASSEN[String(name).split(" ")[0]] || {};
    var weg = (k.alle || []).concat(k[tag] || []), teile = f.split("/"), rest = [], da = {};
    for (var i = 0; i < teile.length; i++) {
      var t = teile[i].replace(/^\s+|\s+$/g, "").replace(/^([^_]+)_.*$/, "$1");
      if (t && weg.indexOf(t) < 0 && !da[t]) { da[t] = 1; rest.push(t); }
    }
    return rest.length ? rest.join("/") : f;
  }
  function spBlock(k) {
    var sp = k.stundenplan;
    if (!sp) return '<div class="vp-sp"><div class="vp-tagname">Stundenplan</div><div class="vp-sa-keine">' +
      (k.spHinweis ? "Nicht erkannt (" + esc(k.spHinweis) + ")" : "Noch keiner vom Kurzbefehl gekommen") + "</div></div>";
    var heuteWt = WT[new Date().getDay()], html = '<div class="vp-sp"><div class="vp-tagname">Stundenplan</div><table><tr><th></th>';
    for (var i = 0; i < sp.tage.length; i++) html += "<th" + (sp.tage[i] === heuteWt ? ' class="vp-sp-heute"' : "") + ">" + esc(sp.tage[i]) + "</th>";
    html += "</tr>";
    for (var s = 0; s < sp.stunden.length; s++) {
      var st = sp.stunden[s];
      html += '<tr><td class="vp-sp-nr">' + esc(st.nr) + (st.zeit ? "<small>" + esc(spZeit(st.zeit)).replace("–", "<br>") + "</small>" : "") + "</td>";
      for (var t = 0; t < sp.tage.length; t++) {
        var z = st.zellen[t] || [];
        html += "<td" + (sp.tage[t] === heuteWt ? ' class="vp-sp-heute"' : "") + ">" + (z.length ? "<b>" + esc(spFach(z[0], k.name, sp.tage[t])) + "</b>" : "") + "</td>";
      }
      html += "</tr>";
    }
    return html + "</table></div>";
  }

  function ausHash() {
    var m = location.hash.match(/[#&]vp=([^&]+)/);
    if (!m) return null;
    var roh = decodeURIComponent(m[1]).replace(/\s/g, "").replace(/-/g, "+").replace(/_/g, "/");
    var text = decodeURIComponent(escape(atob(roh)));
    var bloecke = text.split(/\s*@@KIND@@\s*/), kinder = [];
    for (var i = 0; i < bloecke.length; i++) {
      var b = bloecke[i].replace(/^\s+/, "");
      if (!b) continue;
      var nl = b.indexOf("\n");
      var name = (nl > 0 ? b.slice(0, nl) : "Kind " + (i + 1)).split("(")[0].replace(/^\s+|\s+$/g, "");
      var rest = nl > 0 ? b.slice(nl + 1) : b, teile = rest.split(/@@(S[AP])@@/);
      var plan = parsen(teile[0]);
      for (var t = 1; t + 1 < teile.length; t += 2) {
        if (teile[t] === "SA") plan.schulaufgaben = saParsen(teile[t + 1]);
        else {
          var sp = spParsen(teile[t + 1]);
          if (sp) plan.stundenplan = sp;
          else plan.spHinweis = spBeschreibung(teile[t + 1]);
        }
      }
      plan.name = name;
      kinder.push(plan);
    }
    return { aktualisiert: new Date().getTime(), kinder: kinder,
      info: m[1].length + " Zeichen, " + kinder.length + " Kind(er), " + text.length + " Text" };
  }

  function speichern(d) { try { localStorage.setItem(SPEICHER, JSON.stringify(d)); } catch (e) {} }
  function laden() { try { return JSON.parse(localStorage.getItem(SPEICHER)); } catch (e) { return null; } }

  function tagName(datum) {
    var h = new Date(), m = new Date(); m.setDate(m.getDate() + 1);
    var p = datum.split("-"), wt = WT[new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
    var kurz = wt + " " + p[2] + "." + p[1] + ".";
    if (datum === iso(h)) return "Heute · " + kurz;
    if (datum === iso(m)) return "Morgen · " + kurz;
    return kurz;
  }
  function eintrag(e) {
    var fach = e.fach_alt && e.fach_alt !== e.fach ? "<s>" + esc(e.fach_alt) + "</s> " + esc(e.fach) : esc(e.fach || e.fach_alt);
    var titel;
    if (e.art === "entfall") titel = "<b>" + (fach || "Stunde") + " entfällt</b>";
    else if (e.art === "vertretung") titel = "<b>" + fach + "</b> bei " + esc(e.vertretung) + (e.raum ? " · " + esc(e.raum) : "");
    else titel = "<b>" + fach + "</b>" + (e.raum ? " · Raum " + esc(e.raum) : "");
    return '<div class="vp-zeile vp-' + esc(e.art) + '"><div class="vp-std">' + esc(e.stunde) + '.</div><div class="vp-was">' +
      titel + (e.info ? '<span class="vp-info">' + esc(e.info) + "</span>" : "") + "</div></div>";
  }
  function saBlock(k, heute) {
    if (!k.schulaufgaben) return { html: "", zeilen: 0 };
    var h = new Date(), html = "", n = 0;
    var heute0 = new Date(h.getFullYear(), h.getMonth(), h.getDate()).getTime();
    for (var i = 0; i < k.schulaufgaben.length && n < SA_ANZAHL; i++) {
      var s = k.schulaufgaben[i];
      if (s.datum < heute) continue;
      var p = s.datum.split("-"), tag = new Date(+p[0], +p[1] - 1, +p[2]);
      var diff = Math.round((tag.getTime() - heute0) / 86400000);
      var wann = diff === 0 ? "heute" : diff === 1 ? "morgen" : "in " + diff + " Tagen";
      html += '<div class="vp-sa' + (diff <= 2 ? " vp-sa-bald" : "") + '"><span class="vp-sa-dat">' + WT[tag.getDay()] + " " + p[2] + "." + p[1] + '.</span><span class="vp-sa-titel">' +
        esc(s.titel) + '</span><span class="vp-sa-wann">' + wann + "</span></div>";
      n++;
    }
    if (!n) { html = '<div class="vp-sa vp-sa-keine">Keine angekündigt</div>'; n = 1; }
    return { html: '<div class="vp-sa-block"><div class="vp-tagname">Schulaufgaben</div>' + html + "</div>", zeilen: n };
  }
  function zeichnen(ziel, d) {
    if (!d || !d.kinder) {
      ziel.innerHTML = '<div class="vp-leer">Noch keine Daten. Bitte den Kurzbefehl „Vertretungsplan“ einmal starten.</div>';
      return;
    }
    var heute = iso(new Date()), html = "";
    var mitSA = false;
    for (var q = 0; q < d.kinder.length; q++) if (d.kinder[q].schulaufgaben) mitSA = true;
    for (var i = 0; i < d.kinder.length; i++) {
      var k = d.kinder[i], gezeigt = 0, zeilen = 0;
      html += '<div class="vp-kind"><div class="vp-kopf"><span class="vp-avatar vp-avatar' + (i % 2) + '">' + esc(k.name.charAt(0)) + "</span>" + esc(k.name.split(" ")[0]) + (k.klasse ? "<small>Klasse " + esc(k.klasse) + "</small>" : "") + "</div>";
      for (var j = 0; j < k.tage.length && gezeigt < TAGE_ANZEIGEN; j++) {
        var t = k.tage[j];
        if (t.datum < heute) continue;
        gezeigt++;
        html += '<div class="vp-tag"><div class="vp-tagname">' + tagName(t.datum) + "</div>";
        if (!t.eintraege.length && !t.hinweise.length) { html += '<div class="vp-ok">✓ Keine Änderungen</div>'; zeilen++; }
        for (var n = 0; n < t.hinweise.length; n++) { html += '<div class="vp-hinweis">' + esc(t.hinweise[n]) + "</div>"; zeilen++; }
        for (var x = 0; x < t.eintraege.length; x++) { html += eintrag(t.eintraege[x]); zeilen++; }
        html += "</div>";
      }
      if (!gezeigt) { html += '<div class="vp-ok">Noch kein Plan für die nächsten Tage</div>'; zeilen++; }
      var sab = saBlock(k, heute);
      html += sab.html; zeilen += sab.zeilen;
      var spHtml = spBlock(k);
      for (; zeilen < ZEILEN; zeilen++) html += '<div class="vp-zeile vp-leer-zeile"><div class="vp-std">&nbsp;</div><div class="vp-was">&nbsp;</div></div>';
      html += spHtml + "</div>";
    }
    var alter = Math.round((new Date().getTime() - d.aktualisiert) / 60000);
    var zeit = new Date(d.aktualisiert);
    var hhmm = (zeit.getHours() < 10 ? "0" : "") + zeit.getHours() + ":" + (zeit.getMinutes() < 10 ? "0" : "") + zeit.getMinutes();
    html += '<div class="vp-fuss' + (alter > 6 * 60 ? " vp-alt" : "") + '">Abgerufen ' +
      (iso(zeit) === heute ? "heute " : WT[zeit.getDay()] + " ") + hhmm +
      (fehler ? " · Fehler: " + esc(fehler) : "") + (mitSA ? "" : " · ohne Schulaufgaben") + "</div>";
    ziel.innerHTML = html;
  }

  var CSS =
    ".vp-kind{background:#1b212b;border-radius:12px;padding:14px 16px;margin-bottom:14px}" +
    ".vp-kopf{font-size:26px;font-weight:700;margin-bottom:8px}.vp-kopf small{font-size:16px;font-weight:400;color:#9aa6b5;margin-left:8px}" +
    ".vp-tag{margin-top:10px}.vp-tagname{font-size:15px;text-transform:uppercase;color:#9aa6b5;margin-bottom:4px}" +
    ".vp-zeile{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:baseline;align-items:baseline;padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:20px}" +
    ".vp-std{width:56px;-webkit-flex-shrink:0;flex-shrink:0;font-weight:700}.vp-was{-webkit-flex:1;flex:1}" +
    ".vp-info{display:block;font-size:15px;opacity:.85;margin-top:2px}.vp-was s{opacity:.6}" +
    ".vp-entfall{background:#4a1f24;border-left:6px solid #ff5d6c}.vp-vertretung{background:#4a3a14;border-left:6px solid #ffc53d}" +
    ".vp-raum,.vp-sonstiges{background:#1f3346;border-left:6px solid #5aa9ff}" +
    ".vp-ok{font-size:18px;color:#7ddc8a;padding:4px 0}.vp-hinweis{font-size:16px;color:#c9d1db;padding:4px 0}" +
    ".vp-leer-zeile{background:transparent}" +
    ".vp-sa-block{margin-top:24px}.vp-sa{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:baseline;align-items:baseline;font-size:17px;padding:2px 0;color:#dfe5ec}" +
    ".vp-sa-dat{width:86px;-webkit-flex-shrink:0;flex-shrink:0;color:#9aa6b5;font-size:15px}.vp-sa-titel{-webkit-flex:1;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}" +
    ".vp-sa-wann{-webkit-flex-shrink:0;flex-shrink:0;margin-left:8px;font-size:14px;color:#9aa6b5}.vp-sa-bald .vp-sa-wann{color:#ffc53d;font-weight:700}.vp-sa-keine{color:#9aa6b5;font-size:15px}" +
    ".vp-sp{display:none;margin-top:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px 8px}body.fokus-vp .vp-sp{display:block}body.fokus-vp .vp-leer-zeile{display:none}" +
    ".vp-sp table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}.vp-sp th{font-size:13px;color:#9aa6b5;font-weight:600;padding:2px 3px 4px;text-align:left}" +
    ".vp-sp td{padding:5px 3px;border-top:1px solid rgba(255,255,255,.07);vertical-align:middle;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}" +
    ".vp-sp td b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}.vp-sp td small{display:block;font-size:11px;color:#9aa6b5;overflow:hidden;text-overflow:ellipsis}" +
    ".vp-sp th:first-child,.vp-sp .vp-sp-nr{width:70px}.vp-sp td,.vp-sp th{text-align:center}.vp-sp th:first-child,.vp-sp .vp-sp-nr{text-align:left}.vp-sp .vp-sp-nr small{display:inline-block;vertical-align:middle;font-size:12px;line-height:1.25;margin-left:8px;font-weight:400}.vp-sp .vp-sp-nr{font-weight:700;color:#c3bad0}" +
    ".vp-sp .vp-sp-heute{background:rgba(196,139,255,.14)}.vp-sp th.vp-sp-heute{color:#e6d4ff;border-radius:6px 6px 0 0}" +
    ".vp-leer{font-size:18px;color:#9aa6b5;padding:12px 0}.vp-fuss{font-size:13px;color:#6d7887;margin-top:4px}.vp-fuss.vp-alt{color:#ff8f99}";

  var fehler = "";
  function start(id) {
    var ziel = document.getElementById(id);
    if (!document.getElementById("vp-css")) {
      var st = document.createElement("style"); st.id = "vp-css"; st.appendChild(document.createTextNode(CSS));
      document.head.appendChild(st);
    }
    try {
      var neu = ausHash();
      if (neu) {
        var alt = laden(); // Stundenplan behalten, wenn der Kurzbefehl diesmal keinen mitschickt
        if (alt && alt.kinder) for (var a = 0; a < neu.kinder.length; a++) for (var b = 0; b < alt.kinder.length; b++)
          if (!neu.kinder[a].stundenplan && alt.kinder[b].stundenplan && alt.kinder[b].name === neu.kinder[a].name) neu.kinder[a].stundenplan = alt.kinder[b].stundenplan;
        speichern(neu);
        if (history.replaceState) history.replaceState(null, "", location.pathname + location.search);
      }
    } catch (e) {
      ziel.setAttribute("data-fehler", String(e));
      fehler = String(e) + " (" + location.hash.length + " Zeichen)";
    }
    var anzeigen = function () { zeichnen(ziel, laden()); };
    anzeigen();
    setInterval(anzeigen, 5 * 60 * 1000); // um Mitternacht auf „Heute“ weiterschalten
    window.addEventListener("hashchange", function () { start(id); });
  }

  window.Vertretung = { start: start, parsen: parsen };
})();

Vertretung.start("vertretung");
</script>
</body>
</html>
